<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="./Document_files/style3.css">
</head>
<body>
    <h1 id="heading">Rock Paper Scissor Game</h1>

    <!-- Fixed class name from "im" to "choices" -->
    <div class="choices">
        <div class="choice" id="rock">
            <img src="./Document_files/images" alt="Rock">
        </div>
        <div class="choice" id="paper">
            <img src="./Document_files/images(1)" alt="Paper">
        </div>
        <!-- Standardized id to "scissors" -->
        <div class="choice" id="scissors">
            <img src="./Document_files/your-hand-hand-clipart-png-rock-paper-scissors--m2H7N4b1b1Z5N4i8.jpg" alt="Scissors">
        </div>
    </div>

    <div class="score">
        <div class="user" id="us">
            <p id="u">0</p>
            <p>YOU</p>
        </div>
        <div class="comp" id="cs">
            <p id="c">0</p>
            <p>COMPUTER</p>
        </div>
    </div>

    <div id="msg">
        <p id="m">Play Your Move</p>
    </div>

    <!-- Script linked here -->
    <script src="app.js"></script>
</body>
</html>
